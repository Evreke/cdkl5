# ===========================================================================
# nginx для cdkl5-russia.ru — контейнер nginx:alpine, слушает 8080,
# раздаёт /usr/share/nginx/html.
# TLS терминирует внешний swag-прокси и ПРОБРАСЫВАЕТ Host, поэтому www-хост
# отличается от канонического по server_name.
# ---------------------------------------------------------------------------
# ВАЖНО ПРО НАСЛЕДОВАНИЕ add_header (nginx):
#   add_header наследуется из server{} в location{} ТОЛЬКО если в самом
#   location нет ни одного собственного add_header. У location /_astro/ и
#   у location для картинок/шрифтов есть свой Cache-Control — как только он
#   там объявлен, наследование security-заголовков ОТКЛЮЧАЕТСЯ.
#   Поэтому набор security-заголовков продублирован в этих двух location
#   (см. блок "SECURITY (дубль)"). При правке одного набора — правь ВСЕ
#   ЧЕТЫРЕ: 2 server-блока + 2 location.
# ===========================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Редиректы с относительным Location (например `return 301 /sitemap-index.xml`).
    # Без этого nginx строит абсолютный Location из $scheme и порта listen —
    # за TLS-терминирующим swag клиент получил бы
    # `http://cdkl5-russia.ru:8080/sitemap-index.xml` (проверено в контейнере:
    # curl -H 'Host: cdkl5-russia.ru' .../sitemap.xml -> Location:
    # http://cdkl5-russia.ru:8080/sitemap-index.xml). Внутренний порт и http
    # наружу утекать не должны.
    absolute_redirect off;

    # --- SECURITY: на все ответы, включая 4xx/5xx (`always`) -------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- BROTLI: ОТКЛЮЧЕНО, директива недоступна в официальном nginx:alpine -
    # Проверено на реальном образе:
    #   docker run --rm nginx:alpine nginx -V   -> в выводе НЕТ brotli-модуля
    #   docker run --rm nginx:alpine sh -c 'ls /usr/lib/nginx/modules/' -> .so
    #   с brotli отсутствует (есть только acme/geoip/image-filter/js/xslt).
    # Значит `brotli` / `brotli_static` ниже РАСКОММЕНТИРОВАТЬ НЕЛЬЗЯ: nginx
    # упадёт на старте с "unknown directive "brotli"".
    # Варианты включения Brotli (нужен отдельный тикет/образ):
    #   A) base image со сборкой ngx_brotli, например:
    #      FROM alpine AS nginx-brotli
    #        ... `./configure --add-dynamic-module=/src/ngx_brotli ...`
    #      затем `load_module modules/ngx_http_brotli_filter_module.so;`
    #      и `load_module modules/ngx_http_brotli_static_module.so;`
    #      ВНИМАНИЕ: load_module допустим только в main-контексте (не в этом
    #      файле, он включается в conf.d внутри http{}) — правка Dockerfile.
    #   B) без смены образа — прекомпрессия в CI (`brotli -q 11` / `gzip -9` в
    #      dist/) + `brotli_static on;` (требует всё тот же ngx_brotli) ЛИБО
    #      уже доступный в образе модуль gzip_static
    #      (`nginx -V` -> --with-http_gzip_static_module): тогда `gzip_static on;`
    #      и в CI кладём рядом `*.gz`. Работает на текущем образе, но только gzip.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;
    # brotli_types text/css application/javascript application/json image/svg+xml text/html;

    # Хешированные ассеты Astro — кэш навсегда
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # SECURITY (дубль): свой add_header выше отключил наследование из server{}
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        try_files $uri =404;
    }

    # Картинки/шрифты из public/ — кэш на неделю
    location ~* \.(png|jpg|jpeg|webp|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        # SECURITY (дубль): свой add_header выше отключил наследование из server{}
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        try_files $uri =404;
    }

    # Неканонический путь sitemap -> канонический sitemap-index.xml
    # (robots.txt указывает на /sitemap-index.xml; раньше /sitemap.xml отдавал 404).
    # Своего add_header нет -> security-заголовки наследуются из server{}.
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    # Чистые URL: /about-cdkl5 -> /about-cdkl5/index.html
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}

# www -> канонический хост. Host пробрасывается swag, server_name различает.
# HSTS здесь тоже нужен: иначе www не попадает под HSTS-покрытие.
server {
    listen 8080;
    server_name www.cdkl5-russia.ru;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    return 301 https://cdkl5-russia.ru$request_uri;
}