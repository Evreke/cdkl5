# swag proxy-conf for staging — install as:
#   ~/cdkl5/swag/config/nginx/proxy-confs/staging.subdomain.conf
# Requires:
#   - DNS A record staging.cdkl5-russia.ru -> VPS IP
#   - swag SUBDOMAINS env includes "staging" (cert covers it)
#   - htpasswd at /config/nginx/.htpasswd-staging inside swag
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name staging.cdkl5-russia.ru;

    include /config/nginx/ssl.conf;

    auth_basic "Staging";
    auth_basic_user_file /config/nginx/.htpasswd-staging;

    location / {
        include /config/nginx/proxy.conf;
        resolver 127.0.0.11 valid=30s;

        set $upstream_app cdkl-staging;
        set $upstream_port 8080;
        proxy_pass http://$upstream_app:$upstream_port;
    }
}
