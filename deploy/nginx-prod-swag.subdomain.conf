# SWAG proxy-conf for the prod site (apex + www).
# Install as: ~/swag/swag/config/nginx/proxy-confs/cdkl5-russia.subdomain.conf
# The file name MUST end with .subdomain.conf: swag loads only
# proxy-confs/*.subdomain.conf at top level, so any other name is ignored.
# Requires:
#   - DNS A records: cdkl5-russia.ru and www.cdkl5-russia.ru -> VPS IP
#   - swag env: URL=cdkl5-russia.ru, SUBDOMAINS=www,staging, VALIDATION=http
#   - container `cdkl` running on the external network `cdkl_network` (port 8080)
#
# The apex domain is NOT a swag "subdomain": these server_name blocks take
# precedence over swag's default_server for matching Host headers.
# www is proxied to the same container: site/nginx.conf answers with
# a 301 to the canonical apex host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name cdkl5-russia.ru;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app cdkl;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.cdkl5-russia.ru;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app cdkl;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
