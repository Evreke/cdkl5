name: Сборка
on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # Faster builds

      - name: Build
        run: |
          ./gradlew build

      - name: Prepare Docker artifacts
        run: |
          mkdir -p /tmp/artifacts
          cp build/libs/cdkl5-all.jar /tmp/artifacts/app.jar
          cp Dockerfile /tmp/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.0.0
        with:
          name: app-artifacts
          path: /tmp/artifacts/*

  deploy-staging:
    name: Deploy (staging)
    needs: build
    # Runs only on PRs to trunk (drafts are skipped — remove the draft check if you want them deployed too)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      # One deploy slot per PR: a new push redeploys, an in-flight older deploy is cancelled
      group: deploy-staging-${{ github.event.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout (for staging compose file)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4.0.0
        with:
          name: app-artifacts
          path: artifacts/

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Prepare staging directory
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "mkdir -p /home/${{ secrets.REMOTE_USER }}/cdkl5-staging/artifacts"

      - name: Copy files via SCP
        run: |
          scp -r -P ${{ secrets.REMOTE_PORT }} ./artifacts ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/cdkl5-staging
          scp -P ${{ secrets.REMOTE_PORT }} ./deploy/docker-compose.staging.yaml ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/cdkl5-staging/docker-compose.yaml

      - name: SSH into the server and run commands
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
          set -e
          echo "=== Starting staging deployment ==="

          # Navigate to staging project directory
          echo "Changing to staging directory..."
          cd /home/${{ secrets.REMOTE_USER }}/cdkl5-staging || { echo "Failed to change directory"; exit 1; }

          [ -f docker-compose.yaml ] || { echo "docker-compose.yaml is missing in /home/${{ secrets.REMOTE_USER }}/cdkl5-staging"; exit 1; }

          echo "Copying JAR..."
          cp artifacts/* ./ || { echo "Failed to copy JAR"; exit 1; }

          # Rebuild and restart staging container
          echo "Rebuilding and restarting Docker container..."
          docker compose build --no-cache cdkl && \
          docker compose up -d --force-recreate --no-deps cdkl || { echo "Docker commands failed"; exit 1; }

          echo "Verifying container status..."
          # Scoped to this compose project only — must not match prod containers on the shared host
          docker compose ps --status running --services | grep -qx "cdkl" || { echo "Staging container not running"; exit 1; }

          echo "=== Staging deployment successful ==="
          EOF

  deploy-prod:
    name: Deploy (prod)
    needs: build
    # Runs only on merge into trunk (push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    concurrency:
      # Never run two prod deploys in parallel; queue them instead
      group: deploy-prod

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4.0.0
        with:
          name: app-artifacts
          path: artifacts/

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
      - name: Copy files via SCP
        run: |
          scp -r -P ${{ secrets.REMOTE_PORT }} ./artifacts ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/deploy

      - name: SSH into the server and run commands
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.REMOTE_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
          set -e
          echo "=== Starting deployment ==="

          # Navigate to project directory
          echo "Changing to project directory..."
          cd /home/${{ secrets.REMOTE_USER }}/cdkl5 || { echo "Failed to change directory"; exit 1; }

          echo "Copying JAR..."
          cp /home/${{ secrets.REMOTE_USER }}/deploy/artifacts/* ./ || { echo "Failed to copy JAR"; exit 1; }

          # Rebuild and restart staging containers
          echo "Rebuilding and restarting Docker containers..."
          docker compose build --no-cache cdkl && \
          docker compose up -d --force-recreate || { echo "Docker commands failed"; exit 1; }

          echo "Verifying container status..."
          docker ps --filter "name=cdkl" --format "{{.Status}}" | grep -q "Up" || { echo "Container not running"; exit 1; }

          echo "=== Deployment successful ==="
          EOF
